server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # As rotas do React Router não existem como arquivo no disco: qualquer
    # caminho desconhecido devolve o index para a aplicação resolver.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos gerados levam hash no nome, então podem ser cacheados sem
    # prazo. O index precisa ficar de fora, ou uma versão nova nunca chegaria.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
